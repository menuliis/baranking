<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#090a0d">
<title>ba. song ranking</title>
<meta name="description" content="Rank the ba. catalogue, preview songs, and export your list.">
<style>
:root{
  --bg:#090a0d;--panel:#111318;--panel2:#171a20;--panel3:#20242b;
  --text:#f7f7f5;--muted:#959ca8;--line:#292e37;--line2:#3a414d;
  --accent:#ccff36;--shadow:0 18px 60px rgba(0,0,0,.34)
}
*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;color:var(--text);background:radial-gradient(1000px 500px at 70% -5%,rgba(204,255,54,.08),transparent 60%),var(--bg);
font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}button,a{-webkit-tap-highlight-color:transparent}
.shell{max-width:1080px;margin:auto;padding:34px 18px 110px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:24px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.17em;color:var(--accent);font-weight:900;margin-bottom:9px}
h1{font-size:clamp(46px,8vw,84px);line-height:.87;letter-spacing:-.065em;margin:0}
.hero p{max-width:650px;margin:17px 0 0;color:var(--muted);line-height:1.55;font-size:14px}
.mark{width:98px;height:98px;display:grid;place-items:center;border-radius:24px;background:linear-gradient(145deg,#232831,#0d0f12);border:1px solid var(--line);font-size:39px;font-weight:950;letter-spacing:-.08em;transform:rotate(3deg);box-shadow:var(--shadow)}
.toolbar-wrap{position:sticky;top:0;z-index:70;margin:0 -18px;padding:9px 18px;background:linear-gradient(rgba(9,10,13,.98),rgba(9,10,13,.9) 75%,transparent);backdrop-filter:blur(16px)}
.toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;background:rgba(17,19,24,.94);border:1px solid var(--line);border-radius:16px;padding:8px}
.search{position:relative}.search span{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
input{width:100%;height:45px;border:1px solid transparent;background:var(--panel3);color:var(--text);border-radius:11px;padding:0 13px 0 39px;outline:none}
input:focus{border-color:#606977}
.tools{display:flex;gap:7px}
.btn{height:45px;border:1px solid var(--line2);border-radius:11px;background:var(--panel2);color:var(--text);padding:0 13px;font-weight:800;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#111500}.btn.icon{width:45px;padding:0}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 18px}
.pill{font-size:11px;color:var(--muted);border:1px solid var(--line);background:var(--panel);padding:7px 10px;border-radius:999px}.pill b{color:var(--text)}
.list{display:grid;gap:8px}
.song{position:relative;display:grid;grid-template-columns:52px 66px minmax(0,1fr) auto;align-items:center;gap:12px;min-height:84px;padding:8px 10px 8px 6px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#15181e,#101216);transition:border-color .12s,transform .12s,opacity .12s;touch-action:pan-y}
.song.drag-source{opacity:.22;border-color:var(--accent)}
.song.drop-target{border-color:var(--accent)}
.drag-ghost{
  position:fixed;z-index:300;pointer-events:none;margin:0;
  opacity:.96;transform:scale(1.018);
  box-shadow:0 24px 70px rgba(0,0,0,.58);
  border-color:var(--accent)!important;
  will-change:top,left;
}
body.reordering{user-select:none;-webkit-user-select:none;cursor:grabbing}
body.reordering *{cursor:grabbing!important}
.rank{
  height:54px;border-right:1px solid var(--line);display:grid;place-items:center;
  font-weight:900;font-variant-numeric:tabular-nums;color:#d7dbe1
}
.rank-input{
  width:42px;height:38px;border:1px solid transparent;border-radius:9px;
  background:transparent;color:#d7dbe1;text-align:center;padding:0;
  font:900 18px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-variant-numeric:tabular-nums;outline:none;-moz-appearance:textfield
}
.rank-input::-webkit-outer-spin-button,
.rank-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.rank-input:hover{background:#1c2026}
.rank-input:focus{
  background:#222730;border-color:var(--accent);color:#fff;
  box-shadow:0 0 0 2px rgba(204,255,54,.1)
}
.cover{position:relative;width:66px;height:66px;border:0;padding:0;border-radius:11px;overflow:hidden;background:#1c2027;cursor:pointer;box-shadow:0 7px 20px rgba(0,0,0,.28)}
.cover img{display:block;width:100%;height:100%;object-fit:cover}.cover-fallback{width:100%;height:100%;display:grid;place-items:end start;padding:7px;background:linear-gradient(145deg,#343b47,#121419);font-size:9px;text-align:left;color:#fff;font-weight:900}
.play{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.12);transition:.15s}
.play::before{content:"";width:31px;height:31px;border-radius:50%;background:rgba(9,10,13,.84);box-shadow:0 3px 12px rgba(0,0,0,.35)}
.play::after{content:"";position:absolute;border-left:8px solid white;border-top:5px solid transparent;border-bottom:5px solid transparent;margin-left:3px}
.cover.playing .play{background:rgba(0,0,0,.28)}
.cover.playing .play::after{border:0;width:9px;height:11px;margin:0;background:linear-gradient(90deg,#fff 0 34%,transparent 34% 64%,#fff 64% 100%)}
.cover.loading .play::after{border:2px solid rgba(255,255,255,.45);border-top-color:#fff;width:12px;height:12px;border-radius:50%;margin:0;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cover:hover .play{background:rgba(0,0,0,.25)}
.copy{min-width:0}.title{font-size:15px;font-weight:860;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:6px;align-items:center}
.move,.drag-handle,.brand{height:38px;min-width:38px;border-radius:10px;border:1px solid var(--line2);background:var(--panel3);color:white;display:grid;place-items:center;cursor:pointer;text-decoration:none;padding:0}
.move:disabled{opacity:.23}.drag-handle{font-size:20px;cursor:grab;touch-action:none;font-weight:900}.drag-handle:active{cursor:grabbing;background:#303641}
.brand svg{width:18px;height:18px;display:block}.brand.spotify:hover{border-color:#1ed760}.brand.apple:hover{border-color:#aaa}
.brand.disabled{opacity:.25;pointer-events:none}
.loader{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(145deg,#242933,#101216);font-size:9px;color:var(--muted);font-weight:800}

.export-backdrop{display:none;position:fixed;inset:0;z-index:160;background:rgba(0,0,0,.72);backdrop-filter:blur(12px);align-items:flex-end;justify-content:center;padding:12px}.export-backdrop.show{display:flex}
.export-sheet{width:min(720px,100%);max-height:85vh;overflow:auto;background:#111318;border:1px solid var(--line2);border-radius:21px;padding:15px}
.export-preview{background:#f2efe6;color:#111214;border-radius:16px;padding:22px}.export-preview h2{font-size:38px;line-height:.92;letter-spacing:-.055em;margin:7px 0 17px}.export-row{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:7px 0;border-top:1px solid rgba(0,0,0,.12);font-size:12px;font-weight:750}
.export-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.toast{position:fixed;z-index:220;left:50%;bottom:22px;transform:translate(-50%,16px);opacity:0;transition:.2s;background:#f5f5f2;color:#111;border-radius:999px;padding:10px 14px;font-size:11px;font-weight:850;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
.bottom{display:none}
@media(max-width:760px){
.shell{padding:23px 10px 105px}.hero{margin-bottom:18px}.mark{display:none}h1{font-size:56px}.hero p{font-size:13px}
.toolbar-wrap{margin:0 -10px;padding:7px 10px}.toolbar{grid-template-columns:1fr}.tools{display:grid;grid-template-columns:1fr auto auto}.tools .primary{width:100%}
.song{grid-template-columns:44px 58px minmax(0,1fr);gap:9px;min-height:76px;padding:8px 7px 8px 4px}.rank{height:49px;font-size:14px}.rank-input{width:38px;height:38px;font-size:16px}.cover{width:58px;height:58px;border-radius:9px}
.actions{grid-column:3;gap:5px;margin-top:1px}.move,.drag-handle,.brand{height:42px;min-width:42px}.drag-handle{display:grid}.title{font-size:14px}.meta{font-size:10px}
.bottom{display:grid;position:fixed;z-index:80;left:9px;right:9px;bottom:max(9px,env(safe-area-inset-bottom));grid-template-columns:1fr 1fr;gap:7px;padding:7px;border-radius:15px;background:rgba(17,19,24,.94);border:1px solid var(--line2);backdrop-filter:blur(16px);box-shadow:0 15px 48px rgba(0,0,0,.45)}.bottom .btn{height:48px}
.export-backdrop{padding:7px}.export-sheet{border-radius:20px 20px 10px 10px}
}
@media(max-width:410px){h1{font-size:50px}.song{grid-template-columns:42px 54px minmax(0,1fr);gap:7px}.rank-input{width:36px}.cover{width:54px;height:54px}.actions{gap:4px}.move,.drag-handle,.brand{height:40px;min-width:40px}}





.spotify-audio-shell{
  position:fixed!important;
  left:-99999px!important;
  top:-99999px!important;
  width:1px!important;
  height:1px!important;
  overflow:hidden!important;
  clip-path:inset(100%)!important;
  opacity:0!important;
  pointer-events:none!important;
  z-index:-1!important;
}
.spotify-audio-shell iframe,
.spotify-audio-shell > *{
  width:320px!important;
  height:152px!important;
  min-width:320px!important;
  max-width:none!important;
  margin:0!important;
  padding:0!important;
  border:0!important;
}

</style>

function jsonp(url,params){
 return new Promise((resolve,reject)=>{
  const cb="baApple_"+Date.now()+"_"+Math.random().toString(36).slice(2),script=document.createElement("script");
  const timer=setTimeout(()=>{cleanup();reject(new Error("Apple catalogue timeout"))},15000);
  function cleanup(){clearTimeout(timer);try{delete window[cb]}catch(e){}script.remove()}
  window[cb]=x=>{cleanup();resolve(x)};
  script.onerror=()=>{cleanup();reject(new Error("Apple catalogue failed"))};
  script.src=url+"?"+new URLSearchParams({...params,callback:cb}).toString();document.head.appendChild(script);
 })
}
function chooseResult(song,rows){
 const t=norm(song.title), candidates=rows.filter(x=>norm(x.trackName)===t);
 if(!candidates.length)return null;
 const rel=norm(song.release);
 // Prefer matching collection when it exists, but for singles choose the earliest release of the composition.
 if(!/single|feature/i.test(song.release)){
   const same=candidates.filter(x=>norm(x.collectionName).includes(rel)||rel.includes(norm(x.collectionName)));
   if(same.length)return same.sort((a,b)=>String(a.releaseDate).localeCompare(String(b.releaseDate)))[0];
 }
 return candidates.sort((a,b)=>String(a.releaseDate).localeCompare(String(b.releaseDate)))[0];
}
function mediaObject(x){

  preview:x.previewUrl||"",

  embed:x.trackId?`https://embed.music.apple.com/us/song/${x.trackId}`:""

}
async function hydrateCatalogue(){
 try{
  const data=await jsonp("https://itunes.apple.com/lookup",{id:APPLE_ARTIST_ID,entity:"song",limit:"200",country:"US"});
  const rows=(data.results||[]).filter(x=>x.wrapperType==="track"&&x.kind==="song");
  SONGS.forEach(s=>{const x=chooseResult(s,rows);if(x)media.set(s.id,mediaObject(x))});

  await Promise.all(Object.entries(APPLE_TRACK_OVERRIDES).map(async([songId,o])=>{
    try{
      const exact=await jsonp("https://itunes.apple.com/lookup",{id:o.trackId,entity:"song",country:o.country||"us"});
      const x=(exact.results||[]).find(r=>r.wrapperType==="track"&&r.kind==="song"&&String(r.trackId)===String(o.trackId))
        || (exact.results||[]).find(r=>r.wrapperType==="track"&&r.kind==="song");
      if(x){
        const mm=mediaObject(x);
        mm.apple=o.link||mm.apple;
        media.set(Number(songId),mm);
      }
    }catch(err){
      console.warn("Exact Apple override failed",songId,err);
    }
  }));

  // Rebuild the canonical default using exact earliest Apple release dates where available.
  SONGS.sort((a,b)=>{
    const da=media.get(a.id)?.date||a.dateHint, db=media.get(b.id)?.date||b.dateHint;
    return da.localeCompare(db)||a.id-b.id
  });
  if(!localStorage.getItem(KEY)&&!location.hash)order=SONGS.map(s=>s.id);
  render();
 }catch(e){
  console.warn(e);render()
 }
}

}

function moveToRank(id,requestedRank){
  const songId=Number(id);

  if(from<0)return;

  let rank=parseInt(requestedRank,10);

    if(input)input.value=String(rank);
    return;
  }

  const [item]=order.splice(from,1);
  order.splice(targetIndex,0,item);

  save();
  render();

  requestAnimationFrame(()=>{
    const row=document.querySelector(`.song[data-id="${songId}"]`);
    row?.scrollIntoView({block:"nearest",behavior:"smooth"});
    const input=row?.querySelector(".rank-input");
    input?.focus({preventScroll:true});
    input?.select();
  });
}

function reorder(fromId,toId){
 const from=order.indexOf(Number(fromId)),to=order.indexOf(Number(toId));if(from<0||to<0||from===to)return;
 const [x]=order.splice(from,1);order.splice(to,0,x);save();render()
}

function clearCoverStates(){
  document.querySelectorAll(".cover.playing,.cover.loading").forEach(x=>x.classList.remove("playing","loading"));
}

function stopApplePreview(){
  if(currentAudio){
    currentAudio.pause();
    currentAudio.currentTime=0;
    currentAudio.src="";
  }
  currentAudio=null;
}

function stopSpotifyPreview(){
  if(spotifyController){
    try{spotifyController.pause()}catch(_){}
  }
}

function stopPreview(){
  stopApplePreview();
  stopSpotifyPreview();
  clearCoverStates();
  currentSongId=null;
  currentSource=null;
}

function markPlaying(songId,on){
  const cover=document.querySelector(`.song[data-id="${songId}"] .cover`);
  if(!cover)return;
  cover.classList.remove("loading");
  cover.classList.toggle("playing",!!on);
}

function playSpotifyInvisible(song,cover){
  const cfg=SPOTIFY_TRACK_OVERRIDES[song.id];
  if(!cfg || !spotifyController || !spotifyReady)return false;

  stopApplePreview();
  stopSpotifyPreview();
  clearCoverStates();

  currentSongId=song.id;
  currentSource="spotify";
  cover?.classList.add("loading");

  try{
    const uri=`spotify:track:${cfg.trackId}`;

    if(spotifyLoadedSongId!==song.id){
      spotifyController.loadEntity(uri);
      spotifyLoadedSongId=song.id;

      // loadEntity is asynchronous. The IFrame API still receives this from
      // the same user gesture; play immediately, then retry once on ready/update.
      spotifyController.play();

      let retries=0;
      const retry=()=>{
        if(currentSongId!==song.id || currentSource!=="spotify")return;
        retries+=1;
        try{spotifyController.play()}catch(_){}
        if(retries<3)setTimeout(retry,180);
      };
      setTimeout(retry,120);
    }else{
      spotifyController.togglePlay();
    }

    return true;
  }catch(err){
    console.warn("Invisible Spotify playback failed",err);
    currentSongId=null;
    currentSource=null;
    cover?.classList.remove("loading","playing");
    return false;
  }
}

async function togglePreview(song,cover){
  // Same song: stop.
  if(currentSongId===song.id){
    stopPreview();
    return;
  }

  stopPreview();
  const m=media.get(song.id);

  // Apple direct preview remains the preferred path.
  if(m?.preview){
    cover.classList.add("loading");
    const audio=new Audio();
    audio.preload="auto";
    audio.src=m.preview;
    currentAudio=audio;
    currentSongId=song.id;
    currentSource="apple";

    audio.addEventListener("canplay",()=>{
      if(currentAudio!==audio)return;
      cover.classList.remove("loading");
      cover.classList.add("playing");
    },{once:true});

    audio.addEventListener("ended",()=>{
      if(currentAudio===audio)stopPreview();
    },{once:true});

    audio.addEventListener("error",()=>{
      if(currentAudio!==audio)return;
      stopPreview();
      if(SPOTIFY_TRACK_OVERRIDES[song.id]){
        if(!playSpotifyInvisible(song,cover))toast("Spotify preview is not ready yet");
      }else{
        toast("Preview could not be played");
      }
    },{once:true});

    try{
      await audio.play();
      if(currentAudio===audio){
        cover.classList.remove("loading");
        cover.classList.add("playing");
      }
      return;
    }catch(err){
      if(currentAudio===audio)stopPreview();
      if(SPOTIFY_TRACK_OVERRIDES[song.id]){
        if(!playSpotifyInvisible(song,cover))toast("Spotify preview is not ready yet");
      }else{
        toast("Preview could not start");
      }
      return;
    }
  }

  // Spotify-only tracks: fully invisible player, no popup.
  if(SPOTIFY_TRACK_OVERRIDES[song.id]){
    if(!playSpotifyInvisible(song,cover)){
      toast(spotifyReady ? "Spotify preview could not start" : "Spotify preview is loading — tap again");
    }
    return;
  }

  toast("No audio preview available for this song");
}

function setupSpotifyController(IFrameAPI){
  const shell=document.createElement("div");
  shell.className="spotify-audio-shell";
  shell.setAttribute("aria-hidden","true");

  const host=document.createElement("div");
  host.id="spotify-audio-host";
  shell.appendChild(host);
  document.body.appendChild(shell);

  const first=Object.values(SPOTIFY_TRACK_OVERRIDES)[0];
  if(!first)return;

  IFrameAPI.createController(
    host,
    {
      width:320,
      height:152,
      uri:`spotify:track:${first.trackId}`
    },
    controller=>{
      spotifyController=controller;
      spotifyLoadedSongId=null;

      controller.addListener?.("ready",()=>{
        spotifyReady=true;
      });

      controller.addListener?.("playback_started",event=>{
        if(currentSource!=="spotify" || currentSongId==null)return;
        markPlaying(currentSongId,true);
      });

      controller.addListener?.("playback_update",event=>{
        if(currentSource!=="spotify" || currentSongId==null)return;
        const data=event?.data||{};
        if(data.isBuffering){
          const cover=document.querySelector(`.song[data-id="${currentSongId}"] .cover`);
          cover?.classList.add("loading");
          return;
        }
        markPlaying(currentSongId,!data.isPaused);
      });
    }
  );
}

window.onSpotifyIframeApiReady=IFrameAPI=>setupSpotifyController(IFrameAPI);

function getRowAtPoint(x,y,excludeId){
  const els=document.elementsFromPoint(
    Math.min(innerWidth-4,Math.max(4,x)),
    Math.min(innerHeight-4,Math.max(4,y))
  );
  return els.map(el=>el.closest?.(".song")).find(row=>row && Number(row.dataset.id)!==Number(excludeId)) || null;
}

function autoScrollForPointer(y){
  const edge=Math.min(110,innerHeight*.18);
  let speed=0;
  if(y<edge) speed=-Math.max(6,Math.round((edge-y)/5));
  else if(y>innerHeight-edge) speed=Math.max(6,Math.round((y-(innerHeight-edge))/5));
  if(speed) window.scrollBy(0,speed);
}

function moveGhost(state,x,y){
  state.ghost.style.left=`${state.left}px`;
  state.ghost.style.top=`${y-state.offsetY}px`;
}

function liveReorder(draggedId,targetId,pointerY){
  const from=order.indexOf(Number(draggedId));
  const toRaw=order.indexOf(Number(targetId));
  if(from<0||toRaw<0||from===toRaw)return false;

  const target=document.querySelector(`.song[data-id="${targetId}"]`);
  if(!target)return false;

  const rect=target.getBoundingClientRect();
  const after=pointerY>rect.top+rect.height/2;

  const [item]=order.splice(from,1);
  let to=order.indexOf(Number(targetId));
  if(after)to+=1;
  order.splice(to,0,item);

  save();
  render();
  return true;
}

function cleanupDrag(){
  if(!dragState)return;
  clearTimeout(dragState.holdTimer);
  dragState.ghost?.remove();
  document.body.classList.remove("reordering");
  document.querySelectorAll(".song").forEach(x=>x.classList.remove("drag-source","drop-target"));
  dragState=null;
}

function beginDrag(handle,e){
  const row=handle.closest(".song");
  if(!row)return;

  const rect=row.getBoundingClientRect();
  const state={
    id:Number(row.dataset.id),
    pointerId:e.pointerId,
    source:row,
    startX:e.clientX,
    startY:e.clientY,
    lastX:e.clientX,
    lastY:e.clientY,
    offsetY:e.clientY-rect.top,
    left:rect.left,
    width:rect.width,
    active:false,
    ghost:null,
    holdTimer:null
  };

  dragState=state;

  const activate=()=>{
    if(!dragState || dragState!==state || state.active)return;
    state.active=true;
    state.source.classList.add("drag-source");
    document.body.classList.add("reordering");

    const ghost=state.source.cloneNode(true);
    ghost.classList.remove("drag-source","drop-target");
    ghost.classList.add("drag-ghost");
    ghost.style.width=`${state.width}px`;
    ghost.style.height=`${rect.height}px`;
    ghost.querySelectorAll("button,a").forEach(el=>el.tabIndex=-1);
    document.body.appendChild(ghost);
    state.ghost=ghost;
    moveGhost(state,state.lastX,state.lastY);

    if(navigator.vibrate)navigator.vibrate(12);
  };

  // Mouse/trackpad: immediate. Touch/pen: short hold to avoid accidental reorder while scrolling.
  if(e.pointerType==="mouse") activate();
  else state.holdTimer=setTimeout(activate,120);

  try{handle.setPointerCapture(e.pointerId)}catch(_){}
}

function updateDrag(handle,e){
  const s=dragState;
  if(!s||s.pointerId!==e.pointerId)return;

  s.lastX=e.clientX;
  s.lastY=e.clientY;

  const dist=Math.hypot(e.clientX-s.startX,e.clientY-s.startY);

  if(!s.active && e.pointerType!=="mouse" && dist>9){
    clearTimeout(s.holdTimer);
    // Moving vertically before activation means ordinary page scroll, not drag.
    cleanupDrag();
    return;
  }

  if(!s.active)return;
  e.preventDefault();

  moveGhost(s,e.clientX,e.clientY);
  autoScrollForPointer(e.clientY);

  document.querySelectorAll(".song.drop-target").forEach(x=>x.classList.remove("drop-target"));
  const target=getRowAtPoint(e.clientX,e.clientY,s.id);
  if(target)target.classList.add("drop-target");
}

function endDrag(handle,e){
  const s=dragState;
  if(!s||s.pointerId!==e.pointerId)return;

  clearTimeout(s.holdTimer);

  if(!s.active){
    cleanupDrag();
    return;
  }

  e.preventDefault();
  const target=getRowAtPoint(e.clientX,e.clientY,s.id);
  const draggedId=s.id;
  const y=e.clientY;

  // Clean before render so no stale cloned/listener state survives.
  s.ghost?.remove();
  document.body.classList.remove("reordering");
  dragState=null;

  if(target){
    liveReorder(draggedId,Number(target.dataset.id),y);
  }else{
    render();
  }
}

function bindDragHandles(){
  document.querySelectorAll(".drag-handle").forEach(handle=>{
    handle.onpointerdown=e=>{
      if(e.button!==undefined && e.button!==0)return;
      e.preventDefault();
      beginDrag(handle,e);
    };
    handle.onpointermove=e=>updateDrag(handle,e);
    handle.onpointerup=e=>endDrag(handle,e);
    handle.onpointercancel=e=>endDrag(handle,e);
    handle.onlostpointercapture=e=>{
      if(dragState && dragState.pointerId===e.pointerId && dragState.active){
        cleanupDrag();
        render();
      }
    };
  });
}

function ranking(){return order.map((id,i)=>({rank:i+1,...byId(id)}))}
function rankingText(){return ["ba. — my song ranking","",...ranking().map(x=>`${x.rank}. ${x.title} — ${x.release}`)].join("\n")}
function openExport(){const rows=ranking();$("#exportPreview").innerHTML=`<div style="font-size:9px;text-transform:uppercase;letter-spacing:.17em;font-weight:900;opacity:.55">MY BA. SONG RANKING</div><h2>1 → ${rows.length}</h2>${rows.map(x=>`<div class="export-row"><b>${x.rank}</b><span>${esc(x.title)}</span></div>`).join("")}`;$("#exportModal").classList.add("show")}
function closeExport(){$("#exportModal").classList.remove("show")}
async function copyText(){try{await navigator.clipboard.writeText(rankingText());toast("Ranking copied")}catch(e){prompt("Copy:",rankingText())}}
function downloadBlob(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function csv(){const q=x=>`"${String(x).replaceAll('"','""')}"`;downloadBlob(new Blob(["\ufeffRank,Song,Release\n"+ranking().map(x=>[x.rank,x.title,x.release].map(q).join(",")).join("\n")],{type:"text/csv"}),"ba-song-ranking.csv")}
function png(){
 const rows=ranking(),W=1400,p=90,rh=52,H=230+rows.length*rh+80,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
 x.fillStyle="#f2efe6";x.fillRect(0,0,W,H);x.fillStyle="#111";x.font="900 30px system-ui";x.fillText("MY BA. SONG RANKING",p,75);x.font="900 72px system-ui";x.fillText(`1 → ${rows.length}`,p,150);
 let y=215;for(const r of rows){x.strokeStyle="rgba(0,0,0,.13)";x.beginPath();x.moveTo(p,y-18);x.lineTo(W-p,y-18);x.stroke();x.fillStyle="#777";x.font="800 17px monospace";x.fillText(String(r.rank).padStart(2,"0"),p,y+5);x.fillStyle="#111";x.font="800 21px system-ui";x.fillText(r.title,p+72,y+5);y+=rh}
 c.toBlob(b=>downloadBlob(b,"ba-song-ranking.png"))
}
function reset(){if(confirm("Reset to chronological release order?")){stopPreview();order=[...SONGS].sort((a,b)=>{const da=media.get(a.id)?.date||a.dateHint,db=media.get(b.id)?.date||b.dateHint;return da.localeCompare(db)||a.id-b.id}).map(s=>s.id);save();location.hash="";render()}}
$("#search").oninput=render;$("#share").onclick=$("#mobileShare").onclick=$("#modalShare").onclick=copyShare;$("#reset").onclick=reset;$("#export").onclick=$("#mobileExport").onclick=openExport;$("#exportClose").onclick=closeExport;$("#copy").onclick=copyText;$("#csv").onclick=csv;$("#png").onclick=png;
$("#exportModal").onclick=e=>{if(e.target.id==="exportModal")closeExport()};document.onkeydown=e=>{if(e.key==="Escape"){stopPreview();cleanupDrag();closeExport()}};

load();render();hydrateCatalogue();
</script>
